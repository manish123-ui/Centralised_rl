version: '3.8'

services:
  redis-7000:
    image: redis:7.2
    container_name: redis-7000
    command: >
      redis-server
      --port 7000
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
    ports:
      - "7000:7000"
      - "17000:17000"
    networks:
      - redis-net
      - internal # Bridges connection to your app

  redis-7001:
    image: redis:7.2
    container_name: redis-7001
    command: >
      redis-server
      --port 7001
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
    ports:
      - "7001:7001"
      - "17001:17001"
    networks:
      - redis-net
      - internal

  redis-7002:
    image: redis:7.2
    container_name: redis-7002
    command: >
      redis-server
      --port 7002
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
    ports:
      - "7002:7002"
      - "17002:17002"
    networks:
      - redis-net
      - internal

  redis-cluster-creator:
    image: redis:7.2
    container_name: redis-cluster-creator
    networks:
      - redis-net # Only needs internal bridge to run the command
    depends_on:
      - redis-7000
      - redis-7001
      - redis-7002
    command: >
      sh -c "
      sleep 3;
      echo 'yes' | redis-cli --cluster create \
      redis-7000:7000 \
      redis-7001:7001 \
      redis-7002:7002 \
      --cluster-replicas 0;
      "

networks:
  redis-net:
    driver: bridge
  internal:
    external: true # Pulls in your pre-existing network